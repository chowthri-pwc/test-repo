name: Update PR Description

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  update-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Call LLM and update PR description
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = context.payload.pull_request.number;

            const response = await fetch(`${{ secrets.LLM_API_URL }}/v1/chat/completions`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${{ secrets.LLM_API_KEY }}`
              },
              body: JSON.stringify({
                model: "${{ secrets.LLM_MODEL }}",
                messages: [
                  {
                    role: "user",
                    content: "Generate a short PR description for this pull request."
                  }
                ]
              })
            });

            const data = await response.json();
            console.log(JSON.stringify(data, null, 2));

            const llmOutput = data.choices?.[0]?.message?.content ?? "";

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: llmOutput
            });